name: Generate GitHub Report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Authenticate GitHub CLI
        env:
          TMP_GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "${TMP_GITHUB_TOKEN}" | gh auth login --with-token --hostname "$(jq -r '.hostname' gh-report-config.json)"

      - name: Run gh-get-report-data.sh
        run: ./gh-get-report-data.sh

      - name: Run gh-generate-report.sh
        run: ./gh-generate-report.sh

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "Update GitHub report results" || echo "No changes to commit"
          git push origin HEAD:report-results
